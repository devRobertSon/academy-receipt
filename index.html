<meta charset="utf-8" />
<title>교습비등 영수증 생성 (수납현황 → 별지 제24호서식)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
      "Apple SD Gothic Neo", sans-serif;
    max-width: 920px; margin: 0 auto; padding: 24px; line-height: 1.6;
  }
  h1 { font-size: 1.35rem; margin-bottom: 4px; }
  .sub { color: #666; margin-top: 0; font-size: .9rem; }
  #drop {
    border: 2px dashed #999; border-radius: 12px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: .15s; margin: 18px 0;
  }
  #drop.hover { border-color: #2563eb; background: rgba(37,99,235,.06); }
  #drop b { color: #2563eb; }
  .opt { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  button {
    font-size: 1rem; padding: 10px 18px; border: 0; border-radius: 8px;
    background: #2563eb; color: #fff; cursor: pointer;
  }
  button.sm { font-size: .85rem; padding: 6px 12px; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
  .muted { color: #888; font-size: .85rem; }
  .err { color: #b91c1c; white-space: pre-wrap; }

  /* 게이트(미분류 / 동명이인 확인) */
  .gate { border: 1px solid rgba(234,179,8,.6); background: rgba(234,179,8,.10);
    border-radius: 10px; padding: 14px 16px; margin: 16px 0; }
  .gate h2 { font-size: 1.05rem; margin: 0 0 8px; color: #a16207; }
  .gate table { border-collapse: collapse; width: 100%; font-size: .86rem; margin: 8px 0; }
  .gate th, .gate td { border: 1px solid #ccc; padding: 5px 8px; text-align: left; }
  .gate th { background: rgba(0,0,0,.05); }
  .gate input { padding: 4px 7px; border: 1px solid #bbb; border-radius: 6px; font-size: .86rem; }
  .gate input.num { width: 70px; }
  .gate .grp { border-top: 2px solid #d1a600; margin-top: 10px; padding-top: 6px; }
  .wrap { max-height: 380px; overflow: auto; border: 1px solid #ddd; border-radius: 8px; }

  /* 영수증 (별지 제24호서식) */
  #receipts { margin-top: 12px; }
  .receipt { border: 1.5px solid #222; padding: 18px 22px; margin: 0 auto 22px; max-width: 780px; background: #fff; }
  .receipt, .receipt * { color: #111 !important; }
  .rc-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .rc-serial { font-size: .8rem; font-weight: 600; }
  .rc-formno { text-align: right; font-size: .72rem; color: #555 !important; }
  .rc-title { text-align: center; font-size: 1.35rem; font-weight: 700; letter-spacing: .35em; margin: 4px 0 2px; }
  .rc-ym { text-align: center; font-size: .95rem; font-weight: 600; padding-bottom: 8px; border-bottom: 2px solid #222; margin-bottom: 10px; }
  .rc-meta { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: .84rem; }
  .rc-meta th, .rc-meta td { border: 1px solid #555; padding: 5px 9px; text-align: left; }
  .rc-meta th { background: #f1f1f1; white-space: nowrap; width: 92px; }
  .rc-items { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: .84rem; }
  .rc-items th, .rc-items td { border: 1px solid #555; padding: 5px 9px; white-space: nowrap; }
  .rc-items th { background: #f1f1f1; text-align: center; }
  .rc-items td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .rc-items tr.sum td { font-weight: 700; background: #fafafa; }
  .rc-note { font-size: .76rem; color: #666 !important; margin: 4px 0; }
  .rc-foot { margin-top: 16px; text-align: center; font-size: .92rem; line-height: 2.1; }
  .rc-sign { margin-top: 6px; text-align: right; font-size: .9rem; }
  .rc-seal { height: 48px; width: auto; vertical-align: middle; margin-left: 8px; }

  @media print {
    .screen { display: none !important; }
    body { margin: 0; max-width: none; padding: 0; }
    #receipts { margin: 0; }
    .receipt { border: 1px solid #000; max-width: none; margin: 0; page-break-after: always; }
  }
</style>

<div class="screen">
<h1>교습비등 영수증 생성</h1>
<p class="sub">수납현황 <code>.xls / .xlsx / .csv</code>를 <b>여러 개 한 번에</b> 올리면, 실제 수강한
<b>수납항목</b>을 <code>수납항목매핑.csv</code>로 교습과목에 매핑해 <b>별지 제24호서식</b> 영수증을 만듭니다.
학생은 <b>이름+학년</b>으로 구분하고, 영수증은 <b>영수일 오래된 순</b>으로 정렬됩니다.</p>

<div id="drop">
  📥 수납현황 엑셀/CSV 파일들을 끌어다 놓거나 <b>클릭해서 선택</b>하세요<br />
  <span class="muted">여러 달·여러 파일을 한 번에 올릴 수 있습니다. 파일은 브라우저 안에서만 처리됩니다.</span>
</div>
<input id="files" type="file" accept=".xls,.xlsx,.csv" multiple hidden />

<label class="opt"><input id="excludeRefund" type="checkbox" checked /> 환불(상태='환불') 제외</label>

<div class="bar">
  <button id="printbtn" disabled>🖨 인쇄 / PDF 저장</button>
</div>
<div id="status" class="muted"></div>
<div id="mapstatus" class="muted"></div>
<div id="gate"></div>
</div><!-- /.screen -->

<div id="receipts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  const ACADEMY = { name: "열매맺는나무알파학원", owner: "유한회사 알파학원",
    addr: "세종시 달빛로47 501호", tel: "044-864-6693", reg: "" };
  const MAPPING_CSV = "수납항목매핑.csv";
  const REPO_SEAL = "seal.png";

  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), filesInput = $("files"), receipts = $("receipts");
  const printbtn = $("printbtn"), statusEl = $("status"), mapStatusEl = $("mapstatus"), gateEl = $("gate");
  const excludeRefund = $("excludeRefund");

  const s = (v) => (v == null ? "" : String(v).trim());
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  const won = (n) => Number(n).toLocaleString("ko-KR");
  function toNumber(v){ if(typeof v==="number")return v; if(v==null||v==="")return 0;
    const n=parseFloat(String(v).replace(/[, ]/g,"")); return isNaN(n)?0:n; }
  function monthKey(v){ if(v==null||v==="")return "월미상";
    if(v instanceof Date) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0");
    if(typeof v==="number" && XLSX.SSF){ const d=XLSX.SSF.parse_date_code(v); if(d&&d.y) return d.y+"-"+String(d.m).padStart(2,"0"); }
    const m=String(v).match(/(\d{4})[-.\/\s]+(\d{1,2})/); return m?m[1]+"-"+m[2].padStart(2,"0"):String(v).trim(); }
  function fmtDate(v){ if(v==null||v==="")return "";
    if(v instanceof Date) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
    if(typeof v==="number" && XLSX.SSF){ const d=XLSX.SSF.parse_date_code(v); if(d&&d.y) return d.y+"-"+String(d.m).padStart(2,"0")+"-"+String(d.d).padStart(2,"0"); }
    const m=String(v).match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/); return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):""; }
  const dkey = (d) => (/^\d{4}-\d{2}-\d{2}$/.test(String(d)) ? String(d) : "9999-99-99");

  function parseCSV(text){ text=text.replace(/^﻿/,""); const rows=[];
    text.split(/\r?\n/).forEach((line)=>{ if(line==="")return; const cells=[]; let cur="",q=false;
      for(let i=0;i<line.length;i++){ const ch=line[i];
        if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
        else { if(ch===","){cells.push(cur);cur="";} else if(ch==='"')q=true; else cur+=ch; } }
      cells.push(cur); rows.push(cells); }); return rows; }

  // ── 매핑 로드 ──
  let MAPPING = []; // {kw, subject, price}
  fetch(MAPPING_CSV).then((r)=> r.ok ? r.text() : Promise.reject()).then((txt)=>{
    const rows=parseCSV(txt);
    let hi=rows.findIndex((r)=>r.map((c)=>c.trim()).includes("키워드"));
    if(hi<0) hi=0;
    const head=rows[hi].map((c)=>c.trim());
    const ci={kw:head.indexOf("키워드"), sub:head.indexOf("교습과목"), room:head.indexOf("세부반")};
    for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; if(!r||!s(r[ci.kw]))continue;
      MAPPING.push({ kw:s(r[ci.kw]), subject:s(r[ci.sub])||"기타", room:ci.room>=0?s(r[ci.room]):"" }); }
    MAPPING.sort((a,b)=> b.kw.length-a.kw.length); // 긴 키워드 우선
    mapStatusEl.textContent = "매핑 로드됨: "+MAPPING.length+"개 키워드 (수납항목매핑.csv)";
  }).catch(()=>{ mapStatusEl.innerHTML = '<span class="err">수납항목매핑.csv 를 불러오지 못했습니다 — 저장소 루트에 두세요. (없으면 모두 미분류로 표시됩니다)</span>'; });

  // ── 도장: 저장소의 seal.png 사용 (없으면 (인) 텍스트) ──
  window.__sealErr = function(img){ img.replaceWith(document.createTextNode("(인)")); };
  printbtn.addEventListener("click", ()=>window.print());

  // ── 업로드 ──
  drop.addEventListener("click", ()=>filesInput.click());
  ["dragover","dragenter"].forEach((e)=>drop.addEventListener(e,(ev)=>{ ev.preventDefault(); drop.classList.add("hover"); }));
  ["dragleave","drop"].forEach((e)=>drop.addEventListener(e,()=>drop.classList.remove("hover")));
  drop.addEventListener("drop",(ev)=>{ ev.preventDefault(); if(ev.dataTransfer.files.length) handleFiles(ev.dataTransfer.files); });
  filesInput.addEventListener("change", ()=>{ if(filesInput.files.length) handleFiles(filesInput.files); });
  excludeRefund.addEventListener("change", ()=>{ if(ALL.length) rebuildRecords(); });

  const HEADERS={ no:"NO", name:"이름", grade:"학년", month:"수납월", item:"수납항목", amount:"납부액", status:"상태", payDate:"납부일" };
  let ALL=[];          // raw payment records from all files
  let overrides={};    // 미분류(항목명 기준) 수기입력: item -> {subject, keyword, price}
  let overridesById={};// 기타수납 등 건별 수기입력: recordId -> {subject, keyword, price}
  let splitMap={};     // 동명이인 분리: recordId -> personNo (>=1)
  let splitConfirmed=false;

  // 엑셀은 SheetJS로, CSV는 직접 파싱해 동일한 "행렬(rows)"로 만든다.
  function readRows(f){
    if(/\.csv$/i.test(f.name)) return f.text().then((t)=> parseCSV(t));
    return f.arrayBuffer().then((buf)=>{
      const wb=XLSX.read(buf,{type:"array"}); // cellDates 미사용(타임존 안전)
      return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
    });
  }
  function extractRows(rows){
    let hi=-1, idx={};
    for(let i=0;i<Math.min(rows.length,10);i++){ const r=rows[i].map((c)=>String(c).trim());
      if(r.includes("NO")&&r.includes("이름")&&r.includes("납부액")){ hi=i; for(const k in HEADERS) idx[k]=r.indexOf(HEADERS[k]); break; } }
    if(hi<0) return;
    const data=rows.slice(hi+1);
    for(let i=0;i<data.length;i++){ if(s(data[i][idx.no])==="")continue;
      ALL.push({ month: idx.month>=0?monthKey(data[i][idx.month]):"월미상",
        name:s(data[i][idx.name]), grade:s(data[i][idx.grade]),
        item:s(data[i][idx.item]), amount:toNumber(data[i][idx.amount]),
        status:s(data[i][idx.status]), payDate: idx.payDate>=0?fmtDate(data[i][idx.payDate]):"" }); }
  }
  function handleFiles(fileList){
    const files=[...fileList].filter((f)=>/\.(xlsx|xls|csv)$/i.test(f.name));
    if(!files.length){ statusEl.textContent="엑셀/CSV 파일이 없습니다."; return; }
    statusEl.textContent="읽는 중…";
    Promise.all(files.map(readRows)).then((rowsList)=>{
      ALL=[]; overrides={}; overridesById={}; splitMap={}; splitConfirmed=false;
      rowsList.forEach((rows)=>{ if(rows) extractRows(rows); });
      rebuildRecords();
    }).catch((err)=>{ statusEl.innerHTML='<span class="err">읽기 오류: '+esc(err.message)+'</span>'; });
  }

  function rebuildRecords(){ splitMap={}; splitConfirmed=false; process(); }

  // 기타수납은 자동 매핑하지 않고 항상 건별 수기입력(perRecord) 대상으로 둔다.
  const isEtc = (item) => item.replace(/\s/g,"") === "기타수납";
  function resolve(rec){
    if(overridesById[rec.id]) return { ...overridesById[rec.id], matched:true };
    if(isEtc(rec.item)) return { subject:"", room:"", matched:false, perRecord:true };
    if(overrides[rec.item]) return { ...overrides[rec.item], matched:true };
    for(const m of MAPPING){ if(rec.item.indexOf(m.kw)>=0) return { subject:m.subject, room:m.room||m.kw, matched:true }; }
    return { subject:"", room:"", matched:false, perRecord:false };
  }

  function process(){
    if(!ALL.length) return;
    const dropRefund=excludeRefund.checked;
    // 유효 결제 + 매핑
    const recs=[];
    ALL.forEach((r,i)=>{ if(!r.name) return; if(dropRefund && r.status.indexOf("환불")>=0) return;
      const rec={ id:i, ...r }; recs.push({ ...rec, ...resolve(rec) }); });

    // 1) 수기입력 게이트 — 미분류(항목명) + 기타수납(건별)
    const needStr=[...new Set(recs.filter((r)=>!r.matched && !r.perRecord).map((r)=>r.item))];
    const needRec=recs.filter((r)=>!r.matched && r.perRecord);
    if(needStr.length || needRec.length){ renderManualGate(needStr, needRec); receipts.innerHTML=""; printbtn.disabled=true;
      statusEl.textContent="입력 필요: 미분류 "+needStr.length+"종, 기타수납 "+needRec.length+"건"; return; }

    // 2) 동명이인 게이트 (같은 이름+학년에서 동일 수납항목이 그 달에 2번 이상 → 후보)
    const suspects=findSuspects(recs);
    if(suspects.length && !splitConfirmed){ renderSuspectGate(suspects, recs); receipts.innerHTML=""; printbtn.disabled=true;
      statusEl.textContent="동명이인 확인 필요 "+suspects.length+"건"; return; }

    gateEl.innerHTML="";
    buildReceipts(recs);
  }

  function studentKey(r){ const base=r.name+"|"+r.grade; const n=splitMap[r.id]||1; return n>1? base+"|#"+n : base; }

  // 교습과목별 정가(게시표) + 레벨 미지정 시 학생 학년으로 결정
  const PRICE_TABLE={"과학 초등":200000,"과학 중등":250000,"과학 고등":300000,
    "수학 초등":200000,"수학 중등":250000,"수학 고등":300000,"진학지도":300000};
  function bandFromGrade(g){ const c=String(g).charAt(0); return c==="초"?"초등":c==="중"?"중등":c==="고"?"고등":""; }
  function finalizeSubject(subject,grade){
    // 레벨이 필요한 순수 "수학"/"과학"에만 학생 학년으로 레벨을 붙인다.
    // (진학지도·기타경비·이미 레벨 있는 값은 그대로)
    if(subject!=="수학" && subject!=="과학") return subject;
    const b=bandFromGrade(grade);
    return b ? subject+" "+b : subject;                     // 예: 방학특강 "수학" → "수학 중등"
  }

  function findSuspects(recs){
    const byGM={}; // name|grade|month -> item counts
    recs.forEach((r)=>{ const k=r.name+"|"+r.grade+"|"+r.month; (byGM[k]=byGM[k]||[]).push(r.item); });
    const susNG=new Set();
    Object.keys(byGM).forEach((k)=>{ const items=byGM[k]; const c={}; items.forEach((it)=>c[it]=(c[it]||0)+1);
      if(Object.values(c).some((v)=>v>=2)){ const [nm,gr]=k.split("|"); susNG.add(nm+"|"+gr); } });
    return [...susNG];
  }

  function renderManualGate(stringItems, perRecs){
    let h='<div class="gate"><h2>⚠ 영수증 생성 전 입력 필요</h2>';
    if(stringItems.length){
      h+='<p class="muted"><b>미분류 수납항목 '+stringItems.length+'종</b> — 교습과목(예: 수학 중등 A / 과학 고등)과 세부반</p>'+
        '<div class="wrap"><table><thead><tr><th>수납항목(원문)</th><th>교습과목</th><th>세부반</th></tr></thead><tbody>';
      stringItems.forEach((it,i)=>{ h+='<tr><td>'+esc(it)+'</td>'+
        '<td><input data-t="str" data-i="'+i+'" data-f="subject" value=""></td>'+
        '<td><input data-t="str" data-i="'+i+'" data-f="room" value=""></td></tr>'; });
      h+='</tbody></table></div>';
    }
    if(perRecs.length){
      h+='<p class="muted"><b>기타수납 '+perRecs.length+'건</b> — 각 건을 실제 교습과목으로 입력하세요. (기타수납으로는 영수증이 나오지 않습니다)</p>'+
        '<div class="wrap"><table><thead><tr><th>학생</th><th>수납월</th><th>납부액</th><th>납부일</th><th>교습과목</th><th>세부반</th></tr></thead><tbody>';
      perRecs.forEach((r)=>{ h+='<tr><td>'+esc(r.name)+' <span class="muted">'+esc(r.grade)+'</span></td><td>'+esc(r.month)+'</td>'+
        '<td style="text-align:right">'+won(r.amount)+'</td><td>'+esc(r.payDate||"-")+'</td>'+
        '<td><input data-t="rec" data-id="'+r.id+'" data-f="subject" value=""></td>'+
        '<td><input data-t="rec" data-id="'+r.id+'" data-f="room" value=""></td></tr>'; });
      h+='</tbody></table></div>';
    }
    h+='<div class="bar"><button id="mgok">이대로 진행</button>'+
      '<span class="muted">모든 교습과목을 채워야 진행됩니다.</span></div></div>';
    gateEl.innerHTML=h;
    $("mgok").addEventListener("click", ()=>{
      const strMap={}, recMap={};
      gateEl.querySelectorAll('input[data-t="str"]').forEach((inp)=>{ const i=+inp.dataset.i;
        (strMap[i]=strMap[i]||{item:stringItems[i]})[inp.dataset.f]=inp.value.trim(); });
      gateEl.querySelectorAll('input[data-t="rec"]').forEach((inp)=>{ const id=+inp.dataset.id;
        (recMap[id]=recMap[id]||{id:id})[inp.dataset.f]=inp.value.trim(); });
      const strVals=Object.values(strMap), recVals=Object.values(recMap);
      if(strVals.some((v)=>!v.subject) || recVals.some((v)=>!v.subject)){ alert("교습과목을 모두 입력해 주세요."); return; }
      strVals.forEach((v)=>{ overrides[v.item]={ subject:v.subject, room:v.room||"" }; });
      recVals.forEach((v)=>{ overridesById[v.id]={ subject:v.subject, room:v.room||"" }; });
      process();
    });
  }

  function renderSuspectGate(suspectNG, recs){
    let h='<div class="gate"><h2>⚠ 동명이인 확인 '+suspectNG.length+'건 — 같은 이름+학년인데 같은 수납항목이 반복됩니다</h2>'+
      '<p class="muted">한 사람이 여러 번 낸 것이면 그대로 두고(모두 1), 서로 다른 학생이면 각 결제에 학생 번호(1,2,3…)를 매기세요. 확정해야 영수증이 생성됩니다.</p>';
    suspectNG.forEach((ng)=>{ const [nm,gr]=ng.split("|");
      const list=recs.filter((r)=>r.name===nm && r.grade===gr).sort((a,b)=>dkey(a.payDate).localeCompare(dkey(b.payDate)));
      h+='<div class="grp"><b>'+esc(nm)+'</b> <span class="muted">('+esc(gr||"학년미상")+') · 결제 '+list.length+'건</span>'+
        '<table><thead><tr><th>수납월</th><th>수납항목</th><th>납부액</th><th>납부일</th><th>학생 번호</th></tr></thead><tbody>';
      list.forEach((r)=>{ h+='<tr><td>'+esc(r.month)+'</td><td>'+esc(r.item)+'</td><td style="text-align:right">'+won(r.amount)+
        '</td><td>'+esc(r.payDate||"-")+'</td><td><input class="num" type="number" min="1" value="'+(splitMap[r.id]||1)+'" data-id="'+r.id+'"></td></tr>'; });
      h+='</tbody></table></div>'; });
    h+='<div class="bar"><button id="spok">확정하고 영수증 생성</button></div></div>';
    gateEl.innerHTML=h;
    $("spok").addEventListener("click", ()=>{
      gateEl.querySelectorAll("input[data-id]").forEach((inp)=>{ splitMap[+inp.dataset.id]=Math.max(1, parseInt(inp.value,10)||1); });
      splitConfirmed=true; process();
    });
  }

  function buildReceipts(recs){
    // 그룹: studentKey -> month -> lines
    const map={};
    recs.forEach((r)=>{ const sk=studentKey(r); (map[sk]=map[sk]||{}); (map[sk][r.month]=map[sk][r.month]||[]).push(r); });

    const byMonth={}; const items=[];
    Object.keys(map).forEach((sk)=>{ const name=sk.split("|")[0];
      Object.keys(map[sk]).forEach((month)=>{ const raw=map[sk][month];
        const fin=raw.map((l)=>{ const fsub=finalizeSubject(l.subject,l.grade);
          return { fsub, room:l.room||"", amount:l.amount, payDate:l.payDate,
            isEtc:fsub==="기타경비", isMath:/^수학/.test(fsub) }; });
        const rdate=fin.reduce((mx,l)=>(dkey(l.payDate)>dkey(mx)?l.payDate:mx), "");
        const out=[];

        // ① 과학·진학지도 등: 항목별 실제 라인, 개설반(세부반) 같으면 A/B
        const others=fin.filter((l)=>!l.isMath && !l.isEtc);
        const grp={}; others.forEach((l)=>{ const g=l.fsub+"|"+l.room; (grp[g]=grp[g]||[]).push(l); });
        Object.values(grp).forEach((g)=>{ if(g.length>=2) g.forEach((l,i)=>l._ab=" "+String.fromCharCode(65+i)); });
        others.forEach((l)=> out.push({ subject:l.fsub, room:(l.room||"")+(l._ab||""), amount:l.amount, isEtc:false, note:"" }));

        // ② 수학: 항목별 (교습과목+세부반) 그룹 합산 → 정가 대비 중복수강/중복시간 할인
        const mgroups={};
        fin.filter((l)=>l.isMath).forEach((l)=>{ const room=l.room||"교과"; const key=l.fsub+"|"+room;
          if(!mgroups[key]) mgroups[key]={ subject:l.fsub, room, amount:0 }; mgroups[key].amount+=l.amount; });
        const mathLines=Object.values(mgroups); const nMath=mathLines.length;
        mathLines.forEach((ml)=>{
          const level=ml.subject.replace(/ [AB]$/,"");          // "수학 중등"
          const price=PRICE_TABLE[level]||0;
          const diff=price-ml.amount; const notes=[];
          if(nMath>=2 && diff>0){ const jung=Math.min(50000,diff); notes.push("중복수강 할인 −"+won(jung)+"원");
            const sigan=diff-jung; if(sigan>0) notes.push("중복시간 할인 −"+won(sigan)+"원"); }
          out.push({ subject:ml.subject, room:ml.room, amount:ml.amount, isEtc:false, note:notes.join(" / ") });
        });

        // ③ 기타경비(식사비 등)
        fin.filter((l)=>l.isEtc).forEach((l)=> out.push({ subject:l.fsub, room:l.room||"식사비", amount:l.amount, isEtc:true, note:"" }));

        const it={ name, month, rdate, lines: out };
        items.push(it); (byMonth[month]=byMonth[month]||[]).push(it);
      }); });

    // 일련번호: 수납월별 납부일 오름차순
    Object.keys(byMonth).forEach((month)=>{ byMonth[month]
      .sort((a,b)=>dkey(a.rdate).localeCompare(dkey(b.rdate))||a.name.localeCompare(b.name,"ko"))
      .forEach((it,i)=>{ it.serial=month+"-"+String(i+1).padStart(3,"0"); }); });
    // 전체 정렬: 영수일 오름차순
    items.sort((a,b)=>dkey(a.rdate).localeCompare(dkey(b.rdate))||a.month.localeCompare(b.month)||a.name.localeCompare(b.name,"ko"));

    receipts.innerHTML = items.map(receiptHTML).join("");
    printbtn.disabled = items.length===0;
    const students=new Set(Object.keys(map)).size;
    statusEl.textContent="학생 "+students+"명 · 영수증 "+items.length+"장 (영수일 오름차순)";
    if(items.length) receipts.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function receiptHTML(it){
    const ym=String(it.month).match(/^(\d{4})-(\d{2})$/);
    const ymLabel=ym?ym[1]+"년 "+ym[2]+"월":it.month;
    const ymBun=ym?ym[1]+"년 "+parseInt(ym[2],10)+"월분":it.month;
    const rd=String(it.rdate||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const rdateLabel= rd ? rd[1]+"년 "+parseInt(rd[2],10)+"월 "+parseInt(rd[3],10)+"일"
      : (ym?ym[1]+"년 "+parseInt(ym[2],10)+"월 &nbsp;&nbsp;&nbsp; 일":esc(ymLabel));
    const course=(l)=> l.isEtc?"기타경비":(l.subject==="진학지도"?"진학지도":"보습");
    let body=it.lines.map((l)=>{
      const A=l.isEtc?0:l.amount, B=l.isEtc?l.amount:0;
      const target=l.isEtc?(l.room||"식사비"):l.subject;
      const room=l.isEtc?"":l.room;
      return "<tr><td>"+esc(course(l))+"</td><td>"+esc(target)+"</td><td>"+esc(room)+
        '</td><td class="n">'+won(A)+'</td><td class="n">'+won(B)+'</td><td class="n">'+won(l.amount)+
        "</td><td>"+esc(l.note)+"</td></tr>";
    }).join("");
    const totalA=it.lines.reduce((a,l)=>a+(l.isEtc?0:l.amount),0);
    const totalB=it.lines.reduce((a,l)=>a+(l.isEtc?l.amount:0),0);
    const total=totalA+totalB;
    return '<div class="receipt">'+
      '<div class="rc-top"><span class="rc-serial">일련번호 제 '+esc(it.serial||"")+' 호</span>'+
      '<span class="rc-formno">■ 학원의 설립·운영 및 과외교습에 관한 법률 시행규칙 [별지 제24호서식]</span></div>'+
      '<div class="rc-title">교습비등 영수증</div><div class="rc-ym">'+esc(ymBun)+'</div>'+
      '<table class="rc-meta"><tbody>'+
        "<tr><th>학원(교습소)명</th><td>"+esc(ACADEMY.name)+"</td><th>등록번호</th><td>"+esc(ACADEMY.reg)+"</td></tr>"+
        "<tr><th>소재지</th><td>"+esc(ACADEMY.addr)+"</td><th>전화번호</th><td>"+esc(ACADEMY.tel)+"</td></tr>"+
        "<tr><th>설립·운영자</th><td>"+esc(ACADEMY.owner)+"</td><th>수납 연월</th><td>"+esc(ymLabel)+"</td></tr>"+
        "<tr><th>학습자 성명</th><td colspan='3'>"+esc(it.name)+"</td></tr>"+
      "</tbody></table>"+
      '<table class="rc-items"><thead><tr><th>교습과정</th><th>교습대상</th><th>개설반</th><th>교습비(A)</th><th>기타경비(B)</th><th>합계(A+B)</th><th>비고</th></tr></thead><tbody>'+
        body+'<tr class="sum"><td colspan="3" style="text-align:center">합 계</td><td class="n">'+won(totalA)+
        '</td><td class="n">'+won(totalB)+'</td><td class="n">'+won(total)+"</td><td></td></tr></tbody></table>"+
      '<div class="rc-note">※ 교습과목별 정가 대비 실납부 차액은 중복수강 할인으로 비고에 표기됩니다. 식사비 등은 기타경비(B)에 표기됩니다.</div>'+
      '<div class="rc-foot">위 금액을 정히 <b>영수</b>합니다.<br /><span style="letter-spacing:.1em">영수일자 : '+rdateLabel+'</span></div>'+
      '<div class="rc-sign">'+esc(ACADEMY.name)+" · "+esc(ACADEMY.owner)+
        ' <img class="rc-seal" src="'+REPO_SEAL+'" alt="(인)" onerror="__sealErr(this)" /></div>'+
      "</div>";
  }
})();
</script>
